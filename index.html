<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLF 投研报告库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">MLF 投研报告库</a>
    <nav>
      <a href="index.html" data-nav>首页</a>
      <a href="notes.html" data-nav>记录</a>
      <a href="about.html" data-nav>关于</a>
    </nav>
    <button id="theme-toggle" class="icon-btn" title="切换主题">🌓</button>
  </header>

<main class="container">
  <div class="home-layout">
    <div class="main-col">
      <section class="hero">
        <h1>MLF 投研报告库</h1>
        <p class="hero-sub">A 股投研 · 趋势结构信号 · 板块与个股深度跟踪</p>
        <div class="hero-stats" id="hero-stats"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>趋势-结构-信号</h2>
          <a id="trend-more" class="more" hidden>查看全部 →</a>
        </div>
        <ul id="trend-list" class="report-list"></ul>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>板块</h2>
          <span class="muted">点击板块查看该板块下的全部研究报告</span>
        </div>
        <div id="sector-grid" class="grid"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>个股</h2>
          <a id="stock-more" class="more" hidden>查看全部 →</a>
        </div>
        <ul id="stock-list" class="report-list"></ul>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>其他</h2>
          <a id="other-more" class="more" hidden>查看全部 →</a>
        </div>
        <ul id="other-list" class="report-list"></ul>
      </section>
    </div>

    <aside class="side-col">
      <section class="watch-block">
        <div class="block-head">
          <h2>每日重点监控</h2>
          <button id="clear-watch" class="more" hidden>清空</button>
        </div>
        <ul id="watch-list" class="watch-list"></ul>
        <p id="watch-empty" class="muted small">暂无监控项，点击报告或板块卡片上的「加入重点监控」即可添加至此。</p>
      </section>
    </aside>
  </div>
</main>

  <footer class="site-footer">© <span id="year"></span> MLF · 仅供研究参考，不构成投资建议</footer>

  <script src="data/reports.js"></script>
  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
